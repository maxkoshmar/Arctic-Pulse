services:
  postgres:
    image: postgres:15-alpine
    container_name: arctic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arctic_user
      POSTGRES_PASSWORD: strong_password_123
      POSTGRES_DB: arctic_pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctic_user -d arctic_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_OWNER_EMAIL=admin@arctic.ru
      - N8N_OWNER_PASSWORD=admin123
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=arctic_user
      - DB_POSTGRESDB_PASSWORD=strong_password_123
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy

  directus:
    image: directus/directus:11
    container_name: directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      KEY: 'arctic-pulse-key-2024'
      SECRET: 'arctic-pulse-secret-2024'
      ADMIN_EMAIL: 'admin@arctic.ru'
      ADMIN_PASSWORD: 'admin123'
      DB_CLIENT: 'pg'
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_DATABASE: 'arctic_pulse'
      DB_USER: 'arctic_user'
      DB_PASSWORD: 'strong_password_123'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: '*'
      PUBLIC_URL: 'http://localhost:8055'
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  directus_uploads:

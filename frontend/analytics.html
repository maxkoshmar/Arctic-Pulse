<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аналитика — Пульс Арктики</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a1628;
      color: #e0eaf5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0d2b5e 0%, #1a4a8a 100%);
      padding: 16px 32px;
      border-bottom: 2px solid #2a5aa0;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .aurora { width: 32px; height: 32px; flex-shrink: 0; }
    .logo { font-size: 22px; font-weight: 700; color: #7ecfff; letter-spacing: 1px; white-space: nowrap; }
    .subtitle { font-size: 12px; color: #8ab4d4; margin-top: 2px; white-space: nowrap; }
    .spacer { flex: 1; }

    nav { display: flex; gap: 4px; align-items: center; }
    .nav-link {
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      border-radius: 8px; color: #8ab4d4; text-decoration: none;
      transition: background 0.2s, color 0.2s; border: 1px solid transparent;
    }
    .nav-link:hover { color: #7ecfff; background: rgba(126,207,255,0.08); }
    .nav-link.active { background: #1565c0; color: #fff; border-color: #1976d2; }

    .lang-toggle {
      display: flex; background: #0a1a3a; border: 1px solid #2a4a70;
      border-radius: 20px; overflow: hidden; margin-left: 12px;
    }
    .lang-btn {
      padding: 7px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: transparent;
      color: #8ab4d4; transition: all 0.2s; letter-spacing: 0.5px;
    }
    .lang-btn.active { background: #1565c0; color: #fff; }
    .lang-btn:hover:not(.active) { color: #7ecfff; }

    .container { max-width: 1280px; margin: 0 auto; padding: 32px 16px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    .kpi-card {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .kpi-label { font-size: 12px; color: #7ecfff; text-transform: uppercase; letter-spacing: 0.6px; }
    .kpi-value { font-size: 32px; font-weight: 700; color: #d0e8ff; }
    .kpi-sub { font-size: 12px; color: #5a7a9a; }

    .section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .section-title { font-size: 18px; font-weight: 700; color: #d0e8ff; }
    .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, #1e3a5f, transparent); }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 36px;
    }
    @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

    .chart-box {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 20px;
    }
    .chart-title { font-size: 14px; font-weight: 600; color: #8ab4d4; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 220px; }

    .loading { text-align: center; padding: 40px; color: #8ab4d4; font-size: 14px; }
    .spinner {
      display: inline-block; width: 26px; height: 26px;
      border: 3px solid #1e3a5f; border-top-color: #7ecfff;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-btn {
      background: #1e3a5f; border: 1px solid #2a5a9a; color: #7ecfff;
      padding: 7px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; transition: background 0.2s;
    }
    .refresh-btn:hover { background: #1565c0; }

    .error-box {
      background: #2d1515; border: 1px solid #7d2020; color: #ff8080;
      padding: 12px 16px; border-radius: 8px; font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <svg class="aurora" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="16" fill="#0d2b5e" stroke="#2a5aa0" stroke-width="1.5"/>
      <ellipse cx="18" cy="22" rx="10" ry="4" fill="#7ecfff" opacity="0.15"/>
      <path d="M8 18 Q13 10 18 16 Q23 22 28 14" stroke="#7ecfff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M10 20 Q15 13 18 18 Q21 23 26 16" stroke="#4caf50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <circle cx="18" cy="8" r="2" fill="#ffd54f" opacity="0.9"/>
    </svg>
    <div>
      <div class="logo" data-i18n="title">Пульс Арктики</div>
      <div class="subtitle" data-i18n="subtitle">Мониторинг арктических новостей</div>
    </div>
    <div class="spacer"></div>
    <nav>
      <a href="home.html" class="nav-link" data-i18n="nav_home">Главная</a>
      <a href="index.html" class="nav-link" data-i18n="nav_catalog">Каталог</a>
      <a href="analytics.html" class="nav-link active" data-i18n="nav_analytics">Аналитика</a>
    </nav>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-ru" onclick="setLang('ru')">РУС</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">ENG</button>
    </div>
  </header>

  <div class="container">
    <!-- KPI -->
    <div class="kpi-grid" id="kpiGrid">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title" data-i18n="charts_title">Динамика</div>
        <div class="section-line"></div>
        <button class="refresh-btn" onclick="loadAll()" data-i18n="btn_refresh">↺ Обновить</button>
      </div>
      <div class="charts-row">
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart_arctic_daily">Арктических новостей по дням (30 дней)</div>
          <div class="chart-wrap"><canvas id="chartArcticDaily"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart_tokens_daily">Токены LLM по дням (30 дней)</div>
          <div class="chart-wrap"><canvas id="chartTokensDaily"></canvas></div>
        </div>
      </div>
      <div class="charts-row">
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart_topics">Распределение по темам</div>
          <div class="chart-wrap"><canvas id="chartTopics"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart_sources_top">Топ источников (арктических статей)</div>
          <div class="chart-wrap"><canvas id="chartSources"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8055';
    let currentLang = localStorage.getItem('arctic_lang') || 'ru';

    const I18N = {
      ru: {
        title: 'Пульс Арктики', subtitle: 'Мониторинг арктических новостей',
        nav_home: 'Главная', nav_catalog: 'Каталог', nav_analytics: 'Аналитика',
        charts_title: 'Динамика',
        btn_refresh: '↺ Обновить',
        chart_arctic_daily: 'Арктических новостей по дням (30 дней)',
        chart_tokens_daily: 'Токены LLM по дням (30 дней)',
        chart_topics: 'Распределение по темам',
        chart_sources_top: 'Топ источников (арктических статей)',
        kpi_total: 'Всего новостей', kpi_arctic: 'Арктических', kpi_tokens: 'Токенов использовано',
        kpi_sources: 'Активных источников', kpi_processed: 'Обработано LLM',
        kpi_today: 'Добавлено сегодня',
        topics: {
          'Arctic Militarization': 'Милитаризация',
          'International Governance of Arctic Regions': 'Международное управление',
          'Science & Diplomacy': 'Наука и дипломатия',
          'Not Classified': 'Не классифицировано',
        },
      },
      en: {
        title: 'Arctic Pulse', subtitle: 'Arctic News Monitor',
        nav_home: 'Home', nav_catalog: 'Catalog', nav_analytics: 'Analytics',
        charts_title: 'Trends',
        btn_refresh: '↺ Refresh',
        chart_arctic_daily: 'Arctic news per day (30 days)',
        chart_tokens_daily: 'LLM tokens per day (30 days)',
        chart_topics: 'Topic distribution',
        chart_sources_top: 'Top sources (arctic articles)',
        kpi_total: 'Total articles', kpi_arctic: 'Arctic', kpi_tokens: 'Tokens used',
        kpi_sources: 'Active sources', kpi_processed: 'LLM processed',
        kpi_today: 'Added today',
        topics: {
          'Arctic Militarization': 'Militarization',
          'International Governance of Arctic Regions': 'Int\'l Governance',
          'Science & Diplomacy': 'Science & Diplomacy',
          'Not Classified': 'Not Classified',
        },
      },
    };

    function t(key) { return I18N[currentLang][key] || key; }
    function topicLabel(v) { return (I18N[currentLang].topics || {})[v] || v || '—'; }

    function escapeHtml(v) {
      return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'en-US');
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('arctic_lang', lang);
      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
      applyI18n();
      loadAll();
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
      });
    }

    let charts = {};
    function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

    function buildDailyChart(canvasId, labels, data, label, color) {
      destroyChart(canvasId);
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ label, data, backgroundColor: color + '99', borderColor: color, borderWidth: 1, borderRadius: 3 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#5a7a9a', maxRotation: 45 }, grid: { color: '#1a2f50' } }, y: { ticks: { color: '#5a7a9a' }, grid: { color: '#1a2f50' }, beginAtZero: true } } }
      });
    }

    function buildDonutChart(canvasId, labels, data, colors) {
      destroyChart(canvasId);
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      charts[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#112240', borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#8ab4d4', boxWidth: 14, padding: 12 } } } }
      });
    }

    function buildBarHorizontal(canvasId, labels, data, color) {
      destroyChart(canvasId);
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: color + '99', borderColor: color, borderWidth: 1, borderRadius: 3 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#5a7a9a' }, grid: { color: '#1a2f50' }, beginAtZero: true }, y: { ticks: { color: '#8ab4d4' }, grid: { color: '#1a2f50' } } } }
      });
    }

    async function fetchStats() {
      const [totalRes, arcticRes, tokensRes, sourcesRes, todayRes] = await Promise.all([
        fetch(`${API}/items/news?limit=1&meta=total_count&fields=id`),
        fetch(`${API}/items/news?limit=1&meta=filter_count&fields=id&filter=${encodeURIComponent(JSON.stringify({ is_arctic: { _eq: true } }))}`),
        fetch(`${API}/items/news?limit=5000&fields=tokens_used&filter=${encodeURIComponent(JSON.stringify({ processed_at: { _nnull: true } }))}`),
        fetch(`${API}/items/sources?limit=200&fields=id&filter=${encodeURIComponent(JSON.stringify({ is_active: { _eq: true } }))}`),
        fetch(`${API}/items/news?limit=1&meta=filter_count&fields=id&filter=${encodeURIComponent(JSON.stringify({ created_at: { _gte: new Date().toISOString().slice(0,10) + 'T00:00:00' } }))}`)
      ]);
      const [totalData, arcticData, tokensData, sourcesData, todayData] = await Promise.all([totalRes.json(), arcticRes.json(), tokensRes.json(), sourcesRes.json(), todayRes.json()]);
      const totalTokens = (tokensData.data || []).reduce((s, r) => s + (r.tokens_used || 0), 0);
      const activeSources = (sourcesData.data || []).length;
      const processed = tokensData.data?.length || 0;
      return {
        total: totalData.meta?.total_count || 0,
        arctic: arcticData.meta?.filter_count || 0,
        processed: processed,
        tokens: totalTokens,
        sources: activeSources,
        today: todayData.meta?.filter_count || 0,
      };
    }

    async function fetchDailyData() {
      const since = new Date(); since.setDate(since.getDate() - 29);
      const sinceStr = since.toISOString().slice(0,10) + 'T00:00:00';
      const [arcticRes, tokensRes] = await Promise.all([
        fetch(`${API}/items/news?limit=5000&fields=created_at&filter=${encodeURIComponent(JSON.stringify({ _and: [{ is_arctic: { _eq: true } }, { created_at: { _gte: sinceStr } }] }))}`),
        fetch(`${API}/items/news?limit=5000&fields=processed_at,tokens_used&filter=${encodeURIComponent(JSON.stringify({ _and: [{ processed_at: { _nnull: true } }, { processed_at: { _gte: sinceStr } }] }))}`)
      ]);
      const [arcticData, tokensData] = await Promise.all([arcticRes.json(), tokensRes.json()]);
      const days = [];
      for (let i = 29; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toISOString().slice(0,10)); }
      const arcticByDay = {}, tokensByDay = {};
      (arcticData.data || []).forEach(r => { if (r.created_at) { const d = r.created_at.slice(0,10); arcticByDay[d] = (arcticByDay[d] || 0) + 1; } });
      (tokensData.data || []).forEach(r => { if (r.processed_at) { const d = r.processed_at.slice(0,10); tokensByDay[d] = (tokensByDay[d] || 0) + (r.tokens_used || 0); } });
      return { labels: days.map(d => d.slice(5)), arcticCounts: days.map(d => arcticByDay[d] || 0), tokensCounts: days.map(d => tokensByDay[d] || 0) };
    }

    async function fetchTopicData() {
      const res = await fetch(`${API}/items/news?limit=5000&fields=arctic_topic&filter=${encodeURIComponent(JSON.stringify({ is_arctic: { _eq: true } }))}`);
      const data = await res.json();
      const counts = {};
      (data.data || []).forEach(r => { const k = r.arctic_topic || 'Not Classified'; counts[k] = (counts[k] || 0) + 1; });
      return counts;
    }

    async function fetchSourceArticleCounts() {
      const res = await fetch(`${API}/items/news?limit=10000&fields=source_url,is_arctic`);
      const data = await res.json();
      const counts = {};
      (data.data || []).forEach(r => {
        if (!r.source_url) return;
        let domain = r.source_url;
        try { domain = new URL(r.source_url).hostname.replace(/^www\./, ''); } catch(e) {}
        if (!counts[domain]) counts[domain] = { total: 0, arctic: 0 };
        counts[domain].total++;
        if (r.is_arctic) counts[domain].arctic++;
      });
      return counts;
    }

    function renderKpi(stats) {
      document.getElementById('kpiGrid').innerHTML = [
        { label: t('kpi_total'), value: fmtNum(stats.total), sub: '' },
        { label: t('kpi_today'), value: fmtNum(stats.today), sub: '' },
        { label: t('kpi_processed'), value: fmtNum(stats.processed), sub: '' },
        { label: t('kpi_tokens'), value: fmtNum(stats.tokens), sub: '' },
        { label: t('kpi_sources'), value: fmtNum(stats.sources), sub: '' }
      ].map(k => `<div class="kpi-card"><div class="kpi-label">${escapeHtml(k.label)}</div><div class="kpi-value">${escapeHtml(String(k.value))}</div>${k.sub ? `<div class="kpi-sub">${escapeHtml(k.sub)}</div>` : ''}</div>`).join('');
    }

    function renderCharts(daily, topicCounts, sourceCounts) {
      buildDailyChart('chartArcticDaily', daily.labels, daily.arcticCounts, t('chart_arctic_daily'), '#7ecfff');
      buildDailyChart('chartTokensDaily', daily.labels, daily.tokensCounts, t('chart_tokens_daily'), '#4caf50');
      const topicColors = ['#7ecfff', '#4caf50', '#ffd54f', '#ff9800', '#f44336'];
      buildDonutChart('chartTopics', Object.keys(topicCounts).map(k => topicLabel(k)), Object.values(topicCounts), topicColors);
      const srcEntries = Object.entries(sourceCounts).map(([domain, c]) => ({ name: domain, arctic: c.arctic })).filter(e => e.arctic > 0).sort((a,b) => b.arctic - a.arctic).slice(0,8);
      buildBarHorizontal('chartSources', srcEntries.map(e => e.name.length > 22 ? e.name.slice(0,22)+'…' : e.name), srcEntries.map(e => e.arctic), '#7ecfff');
    }

    async function loadAll() {
      try {
        const [stats, daily, topicCounts, sourceCounts] = await Promise.all([fetchStats(), fetchDailyData(), fetchTopicData(), fetchSourceArticleCounts()]);
        renderKpi(stats);
        renderCharts(daily, topicCounts, sourceCounts);
      } catch (err) {
        document.getElementById('kpiGrid').innerHTML = `<div class="error-box">Ошибка загрузки данных: ${escapeHtml(err.message)}. Убедитесь что Directus запущен (http://localhost:8055)</div>`;
      }
    }

    document.getElementById('btn-ru').classList.toggle('active', currentLang === 'ru');
    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.documentElement.lang = currentLang;
    applyI18n();
    loadAll();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пульс Арктики / Arctic Pulse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a1628;
      color: #e0eaf5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0d2b5e 0%, #1a4a8a 100%);
      padding: 16px 32px;
      border-bottom: 2px solid #2a5aa0;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .aurora { width: 32px; height: 32px; flex-shrink: 0; }
    header .logo { font-size: 22px; font-weight: 700; color: #7ecfff; letter-spacing: 1px; white-space: nowrap; }
    header .subtitle { font-size: 12px; color: #8ab4d4; margin-top: 2px; white-space: nowrap; }
    header .spacer { flex: 1; }

    nav { display: flex; gap: 4px; align-items: center; }
    .nav-link {
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      border-radius: 8px; color: #8ab4d4; text-decoration: none;
      transition: background 0.2s, color 0.2s; border: 1px solid transparent;
    }
    .nav-link:hover { color: #7ecfff; background: rgba(126,207,255,0.08); }
    .nav-link.active { background: #1565c0; color: #fff; border-color: #1976d2; }

    .lang-toggle {
      display: flex;
      background: #0a1a3a;
      border: 1px solid #2a4a70;
      border-radius: 20px;
      overflow: hidden;
      margin-left: 12px;
    }
    .lang-btn {
      padding: 7px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: transparent;
      color: #8ab4d4; transition: all 0.2s; letter-spacing: 0.5px;
    }
    .lang-btn.active { background: #1565c0; color: #fff; }
    .lang-btn:hover:not(.active) { color: #7ecfff; }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #d0e8ff;
      letter-spacing: 0.3px;
    }
    .section-badge {
      background: #0d3060;
      color: #7ecfff;
      border: 1px solid #2a5a9a;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, #1e3a5f, transparent);
    }

    .digest-section { margin-bottom: 48px; }
    .digest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .digest-card {
      background: linear-gradient(135deg, #0f2a54 0%, #112240 100%);
      border: 1px solid #2a5a9a;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .digest-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #7ecfff, #4caf50, transparent);
      opacity: 0.6;
    }
    .digest-card:hover {
      border-color: #7ecfff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(126,207,255,0.1);
    }
    .digest-num {
      position: absolute;
      top: 14px; right: 16px;
      font-size: 36px;
      font-weight: 900;
      color: rgba(126,207,255,0.06);
      line-height: 1;
      pointer-events: none;
    }
    .digest-topic {
      background: #0d3060; color: #7ecfff; border: 1px solid #2a5a9a;
      font-size: 11px; padding: 3px 10px; border-radius: 12px;
      display: inline-block; width: fit-content;
    }
    .digest-title {
      font-size: 15px; font-weight: 600; color: #d0e8ff; line-height: 1.4;
    }
    .digest-summary {
      font-size: 13px; color: #8ab4d4; line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .digest-card.expanded .digest-summary {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .digest-footer {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 12px; color: #5a7a9a;
      border-top: 1px solid #1e3a5f; padding-top: 10px;
    }
    .digest-source { color: #4a8abf; text-decoration: none; }
    .digest-source:hover { color: #7ecfff; }

    .latest-section { margin-bottom: 40px; }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .news-card {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 18px;
      display: flex; flex-direction: column; gap: 8px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .news-card:hover { border-color: #7ecfff; transform: translateY(-2px); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .topic-badge {
      background: #0d3060; color: #7ecfff; border: 1px solid #2a5a9a;
      font-size: 11px; padding: 3px 10px; border-radius: 12px; white-space: nowrap;
    }
    .card-title {
      font-size: 14px; font-weight: 600; color: #d0e8ff; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .news-card.expanded .card-title {
      display: block; -webkit-line-clamp: unset; overflow: visible;
    }
    .card-summary {
      font-size: 12px; color: #8ab4d4; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .news-card.expanded .card-summary {
      display: block; -webkit-line-clamp: unset; overflow: visible;
    }
    .card-footer {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 11px; color: #5a7a9a;
      border-top: 1px solid #1e3a5f; padding-top: 8px; margin-top: 2px;
    }
    .card-source { color: #4a8abf; text-decoration: none; }
    .card-source:hover { color: #7ecfff; }
    .card-date { white-space: nowrap; flex-shrink: 0; }
    .no-summary { font-size: 11px; color: #3a5a7a; font-style: italic; }

    .catalog-cta {
      text-align: center;
      margin: 16px 0 48px;
    }
    .catalog-cta a {
      display: inline-block;
      background: linear-gradient(135deg, #1565c0, #1976d2);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .catalog-cta a:hover { opacity: 0.85; }

    .loading { text-align: center; padding: 40px; color: #8ab4d4; font-size: 15px; }
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid #1e3a5f; border-top-color: #7ecfff;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 40px; color: #5a7a9a; }

    .date-badge {
      background: #0a1a3a;
      border: 1px solid #1e3a5f;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: #8ab4d4;
      display: inline-block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <svg class="aurora" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="16" fill="#0d2b5e" stroke="#2a5aa0" stroke-width="1.5"/>
      <ellipse cx="18" cy="22" rx="10" ry="4" fill="#7ecfff" opacity="0.15"/>
      <path d="M8 18 Q13 10 18 16 Q23 22 28 14" stroke="#7ecfff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M10 20 Q15 13 18 18 Q21 23 26 16" stroke="#4caf50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <circle cx="18" cy="8" r="2" fill="#ffd54f" opacity="0.9"/>
    </svg>
    <div>
      <div class="logo" data-i18n="title">Пульс Арктики</div>
      <div class="subtitle" data-i18n="subtitle">Мониторинг арктических новостей</div>
    </div>
    <div class="spacer"></div>
    <nav>
      <a href="home.html" class="nav-link active" data-i18n="nav_home">Главная</a>
      <a href="index.html" class="nav-link" data-i18n="nav_catalog">Каталог</a>
      <a href="analytics.html" class="nav-link" data-i18n="nav_analytics">Аналитика</a>
    </nav>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-ru" onclick="setLang('ru')">РУС</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">ENG</button>
    </div>
  </header>

  <div class="container">
    <!-- Daily Digest -->
    <div class="digest-section">
      <div class="section-header">
        <div class="section-title" data-i18n="digest_title">Сводка дня</div>
        <div class="section-badge" id="digestDate"></div>
        <div class="section-line"></div>
        <div class="section-badge" data-i18n="digest_badge">6 ключевых материалов</div>
      </div>
      <div id="digestContent">
        <div class="loading"><div class="spinner"></div><div data-i18n="loading">Загрузка...</div></div>
      </div>
    </div>

    <div class="latest-section">
      <div class="section-header">
        <div class="section-title" data-i18n="latest_title">Последние новости</div>
        <div class="section-line"></div>
        <div class="section-badge" data-i18n="latest_badge">15 свежих материалов</div>
      </div>
      <div id="latestContent">
        <div class="loading"><div class="spinner"></div><div data-i18n="loading">Загрузка...</div></div>
      </div>
    </div>

    <div class="catalog-cta">
      <a href="index.html" data-i18n="catalog_link">Открыть полный каталог →</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8055';
    let currentLang = localStorage.getItem('arctic_lang') || 'ru';

    const I18N = {
      ru: {
        title: 'Пульс Арктики',
        subtitle: 'Мониторинг арктических новостей',
        nav_home: 'Главная',
        nav_catalog: 'Каталог',
        nav_analytics: 'Аналитика',
        digest_title: 'Сводка дня',
        digest_badge: '6 ключевых материалов',
        latest_title: 'Последние новости',
        latest_badge: '15 свежих материалов',
        catalog_link: 'Открыть полный каталог →',
        loading: 'Загрузка...',
        no_results: 'Нет данных',
        source_link: 'Источник ↗',
        no_summary: 'Краткое изложение недоступно',
        expand: 'Нажмите, чтобы раскрыть',
        collapse: 'Нажмите, чтобы свернуть',
        topics: {
          'Arctic Militarization': 'Милитаризация Арктики',
          'International Governance of Arctic Regions': 'Международное управление',
          'Science & Diplomacy': 'Наука и дипломатия',
          'Not Classified': 'Не классифицировано',
        },
      },
      en: {
        title: 'Arctic Pulse',
        subtitle: 'Arctic News Monitor',
        nav_home: 'Home',
        nav_catalog: 'Catalog',
        nav_analytics: 'Analytics',
        digest_title: 'Daily Digest',
        digest_badge: '6 key stories',
        latest_title: 'Latest News',
        latest_badge: '16 recent stories',
        catalog_link: 'Open full catalog →',
        loading: 'Loading...',
        no_results: 'No data',
        source_link: 'Source ↗',
        no_summary: 'Summary not available',
        expand: 'Click to expand',
        collapse: 'Click to collapse',
        topics: {
          'Arctic Militarization': 'Arctic Militarization',
          'International Governance of Arctic Regions': 'International Governance',
          'Science & Diplomacy': 'Science & Diplomacy',
          'Not Classified': 'Not Classified',
        },
      },
    };

    function t(key) { return I18N[currentLang][key] || key; }
    function topicLabel(topic) { return (I18N[currentLang].topics || {})[topic] || topic || ''; }
    function escapeHtml(v) { return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString(currentLang==='ru'?'ru-RU':'en-US', { day:'2-digit', month:'short', year:'numeric' });
    }
    function stripHtml(html) { return (html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }
    function getSummaryText(item) {
      if (item.summary_ai) return item.summary_ai;
      if (item.content_clean) return stripHtml(item.content_clean);
      if (item.content) return stripHtml(item.content);
      return null;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('arctic_lang', lang);
      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
      applyI18n();
      renderAll();
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
      });
    }

    let digestItems = [];
    let latestItems = [];

    async function fetchNews() {
      const fields = 'id,title,summary_ai,content_clean,content,source_url,publication_date,arctic_topic';
      // Последние 16 новостей (без фильтра is_arctic)
      const latestParams = new URLSearchParams({
        limit: 15, offset: 0, sort: '-publication_date',
        fields
      });
      // Для сводки: 6 последних новостей
      const digestParams = new URLSearchParams({
        limit: 6, offset: 0, sort: '-publication_date',
        fields
      });
      const [latestRes, digestRes] = await Promise.all([
        fetch(`${API}/items/news?${latestParams}`),
        fetch(`${API}/items/news?${digestParams}`)
      ]);
      if (!latestRes.ok || !digestRes.ok) throw new Error('API error');
      const [latestData, digestData] = await Promise.all([latestRes.json(), digestRes.json()]);
      latestItems = latestData.data || [];
      digestItems = digestData.data || [];
    }

    function renderAll() {
      renderDigest();
      renderLatest();
    }

    function renderDigest() {
      const el = document.getElementById('digestContent');
      if (!digestItems.length) {
        el.innerHTML = `<div class="empty-state">${t('no_results')}</div>`;
        return;
      }
      el.innerHTML = `<div class="digest-grid">${digestItems.map((item, i) => renderDigestCard(item, i+1)).join('')}</div>`;
    }

    function renderDigestCard(item, num) {
      const topic = item.arctic_topic ? topicLabel(item.arctic_topic) : '';
      const topicBadge = topic ? `<span class="digest-topic">${escapeHtml(topic)}</span>` : '';
      const summary = getSummaryText(item);
      const summaryPreview = summary ? (summary.length > 200 ? summary.slice(0,200)+'…' : summary) : '';
      const isValidUrl = item.source_url && (item.source_url.startsWith('http://') || item.source_url.startsWith('https://'));
      const sourceHtml = isValidUrl ? `<a class="digest-source" href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('source_link')}</a>` : `<span></span>`;
      return `
        <div class="digest-card" onclick="toggleDigest(this)">
          <div class="digest-num">${num}</div>
          ${topicBadge}
          <div class="digest-title">${escapeHtml(item.title || '—')}</div>
          ${summary ? `<div class="digest-summary">${escapeHtml(summaryPreview)}</div>` : `<div class="no-summary">${t('no_summary')}</div>`}
          <div class="digest-footer">
            ${sourceHtml}
            <span>${fmtDate(item.publication_date)}</span>
          </div>
        </div>`;
    }

    function toggleDigest(card) { card.classList.toggle('expanded'); }

    function renderLatest() {
      const el = document.getElementById('latestContent');
      if (!latestItems.length) {
        el.innerHTML = `<div class="empty-state">${t('no_results')}</div>`;
        return;
      }
      el.innerHTML = `<div class="news-grid">${latestItems.map(renderNewsCard).join('')}</div>`;
    }

    function renderNewsCard(item) {
      const topic = item.arctic_topic ? topicLabel(item.arctic_topic) : '';
      const topicBadge = (topic && topic !== (I18N[currentLang].topics?.['Not Classified'] || 'Not Classified')) ? `<span class="topic-badge">${escapeHtml(topic)}</span>` : '';
      const summary = getSummaryText(item);
      const summaryPreview = summary ? (summary.length > 200 ? summary.slice(0,200)+'…' : summary) : '';
      const isValidUrl = item.source_url && (item.source_url.startsWith('http://') || item.source_url.startsWith('https://'));
      const sourceHtml = isValidUrl ? `<a class="card-source" href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('source_link')}</a>` : `<span></span>`;
      
      return `
        <div class="news-card" onclick="toggleCard(this)">
          <div class="card-header"><div style="display:flex;gap:6px;flex-wrap:wrap;">${topicBadge}</div></div>
          <div class="card-title">${escapeHtml(item.title || '—')}</div>
          ${summary ? `<div class="card-summary" data-full="${escapeHtml(summary)}" data-preview="${escapeHtml(summaryPreview)}">${escapeHtml(summaryPreview)}</div>` : `<div class="no-summary">${t('no_summary')}</div>`}
          <div class="card-footer">
            ${sourceHtml}
            <span class="card-date">${fmtDate(item.publication_date)}</span>
          </div>
        </div>`;
    }

    function toggleCard(card) {
      const expanded = card.classList.toggle('expanded');
      const summary = card.querySelector('.card-summary');
      if (summary) {
        summary.textContent = expanded ? (summary.dataset.full || '') : (summary.dataset.preview || '');
      }
    }

    function updateDateBadge() {
      const el = document.getElementById('digestDate');
      if (el) {
        el.textContent = new Date().toLocaleDateString(currentLang==='ru'?'ru-RU':'en-US', { day:'numeric', month:'long', year:'numeric' });
      }
    }

    document.getElementById('btn-ru').classList.toggle('active', currentLang === 'ru');
    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.documentElement.lang = currentLang;
    updateDateBadge();
    applyI18n();

    fetchNews()
      .then(() => renderAll())
      .catch(err => {
        document.getElementById('digestContent').innerHTML = `<div class="empty-state">Ошибка загрузки: ${escapeHtml(err.message)}</div>`;
        document.getElementById('latestContent').innerHTML = '';
      });
  </script>
</body>
</html>
